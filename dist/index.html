<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 64px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; }
  h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.1; }
  p { margin: 0 0 16px; color: #cbd5e1; font-size: 18px; line-height: 1.5; }
  .badge { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #22c55e; color: #052e16; font-weight: 700; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  .tile strong { display: block; margin-bottom: 6px; }
  .tile span { color: #94a3b8; font-size: 14px; }
  footer { margin-top: 24px; color: #64748b; font-size: 14px; }
</style>
</head>
<body>
<main class="wrap">
<div class="card">
<div class="badge">● LIVE</div>
<h1>PlayGround is running</h1>
<p>Static deployment served from <code>/dist</code>. If you can read this, startup and preview routing work.</p>
<div class="grid">
<div class="tile"><strong>Build</strong><span>Static files in PROJECT_DIR/dist</span></div>
<div class="tile"><strong>Server</strong><span>Foreground on PORT 3000</span></div>
<div class="tile"><strong>Capture</strong><span>Desktop + mobile screenshots</span></div>
</div>
<footer>PlayGround &middot; OMGithub static preview</footer>
</div>
</main>
</body>
</html>
